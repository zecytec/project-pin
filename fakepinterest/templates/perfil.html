{% extends 'homepage.html' %}

{% block titulo %}
perfil - {{usuario}}
{% endblock %}

{% block body %}

<body>
<p>Perfil do {{ usuario.username }}</p>
<a href="{{ url_for('logout')}}">sair</a>


{% if form %}

<form method="post", enctype="multipart/form-data">
    {{ form.csrf_token }}

    {{ form.foto() }}
    {{ form.botao_confirmacao() }}
</form>

{% endif %}

<img src="{{ url_for('static', filename='fotos_post/default.png') }}">


{% for foto in usuario.fotos %}
<img src="default.png">
{% endfor %}


</body>

{% endblock %}
